<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="top">
    <button id="sessions-btn" class="title-btn" title="Các cuộc chat">
      <span id="title">Chat mới</span>
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <span id="status-dot" class="dot" title="Kết nối"></span>
    <button id="new-btn" class="icon-btn" title="Chat mới (Ctrl+N)">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>

  <aside id="drawer" hidden>
    <input id="drawer-search" type="search" placeholder="Tìm cuộc chat…">
    <div id="drawer-list"></div>
  </aside>

  <div id="banner" hidden></div>

  <main id="scroller">
    <div id="empty" class="empty">
      <div class="logo">✻</div>
      <h1>Chào bạn, hôm nay làm gì?</h1>
      <label class="cwd-label" for="cwd">Thư mục làm việc</label>
      <input id="cwd" list="recent-dirs" spellcheck="false" autocomplete="off">
      <datalist id="recent-dirs"></datalist>
    </div>
    <div id="messages"></div>
    <div id="working" hidden><span class="spark">✻</span> <span id="working-text">Đang làm…</span></div>
  </main>

  <footer class="composer">
    <div id="slash-menu" hidden></div>
    <div class="box">
      <textarea id="input" rows="1" placeholder="Hỏi Claude… (gõ / để xem lệnh)"></textarea>
      <div class="row">
        <select id="mode" title="Chế độ quyền (Shift+Tab)">
          <option value="default">Hỏi trước khi làm</option>
          <option value="acceptEdits">Tự nhận sửa file</option>
          <option value="plan">Lập kế hoạch</option>
          <option value="auto">Auto</option>
          <option value="bypassPermissions">Bỏ qua quyền</option>
        </select>
        <select id="model" title="Model"><option value="">Model mặc định</option></select>
        <span class="spacer"></span>
        <span id="cwd-chip" class="chip" hidden></span>
        <button id="send" class="send" title="Gửi (Enter)" disabled>
          <svg id="send-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg id="stop-icon" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="2" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </footer>

  <script src="lib/marked.umd.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="panel.js"></script>
</body>
</html>
